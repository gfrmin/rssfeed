services:
  db:
    # pgvector's image is built FROM postgres:17, so this is a drop-in swap on an
    # existing pgdata volume (same PG major). It adds the `vector` extension, which
    # backs entry_embeddings.emb and the related-articles nearest-neighbour search.
    # Reverting to plain postgres:17 requires dropping the vector column/index and
    # the extension first, or the server won't start (the .so goes away with it).
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: miniflux
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-miniflux}
      POSTGRES_DB: miniflux
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Loopback by default. This published `5433:5432` on EVERY interface, with
    # POSTGRES_PASSWORD defaulting to "miniflux" -- so following the quick start on
    # a laptop put a trivially-credentialled database on whatever network it joined
    # next. Nothing needs it to be wider: the sidecar connects over localhost and
    # miniflux reaches it on the compose network, not through this publication.
    # Set RSSFEED_PUBLISH_HOST to widen it deliberately.
    ports:
      - "${RSSFEED_PUBLISH_HOST:-127.0.0.1}:${RSSFEED_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "miniflux"]
      interval: 10s
      start_period: 30s
    restart: unless-stopped

  miniflux:
    image: miniflux/miniflux:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://miniflux:${POSTGRES_PASSWORD:-miniflux}@db/miniflux?sslmode=disable
      RUN_MIGRATIONS: "1"
      CREATE_ADMIN: "1"
      ADMIN_USERNAME: ${MINIFLUX_ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${MINIFLUX_ADMIN_PASSWORD:-changeme}
      CLEANUP_ARCHIVE_READ_DAYS: "-1"
      CLEANUP_ARCHIVE_UNREAD_DAYS: "-1"
      POLLING_FREQUENCY: "15"
      POLLING_PARSING_ERROR_LIMIT: "0"
    # Same default. Miniflux does authenticate, so this is a weaker argument than
    # the database above -- but the README's security model says the boundary is
    # network placement, and a default that contradicts it teaches the wrong habit.
    ports:
      - "${RSSFEED_PUBLISH_HOST:-127.0.0.1}:9144:8080"
    restart: unless-stopped


volumes:
  pgdata:
