persona: owner-phone-reader
jtbd: "When a feed only gives a teaser, or the text looks wrong, I want the whole article as the publisher shows it, so I can read it here instead of going to the site."
provenance: evidence
source: >-
  Owner's Claude prompt history (private, see README): 2026-03-30 (the founding request: "see the full
  article of a URL in my feed, not just the summary"), 2026-03-31 (a political blog's lost colours and
  links, "part of the charm"; "investigate why this article seems incomplete"), 2026-04-02/04-03
  (missing photos; "information about source of text (rss feed only, full article text v.x)";
  refetch should "replace article text immediately"), 2026-04-10 ("full article starts with the
  quote and not the paragraph before it"), 2026-04-26 (pictures missing), 2026-06-26 ("clicking
  fetch full text doesn't do anything ... hard to know if it's working"; "Refetch Fetching... on
  the button without any change"; "if full fetch gives empty content that's what should be shown,
  with the option to toggle to original rss content"), 2026-07-17 ("a robust extraction system
  ... with ground truth"), 2026-08-05 (an entry "is rss only"; a feed that used to get full text
  stopped). Behaviour, prod DB 2026-10-18: 29 open_original events since 2026-06-21.
steps:
  - id: see-what-text-this-is
    goal: Know whether I'm reading the feed's text or the fetched full article, and how complete it is
    surface: sidecar
    route: /entries/{entry_id}
    success: A plain label above the text (feed text / full article, with version) that matches the text below it
    first_screen: The source label and the start of the article body
    failure_modes:
      - Full text was fetched but is empty or shorter than the feed text → show what was fetched, say so, and offer the feed text
      - Fetched text drops images, links or inline colour the original has → judged against the original page, not against "has some text"
      - Extraction starts mid-article (skips the lead paragraph) → content-correctness check against the original
    scent: '"Feed text" vs "Full article", not internal terms like "RSS content only" or "snapshot"'
  - id: fetch-or-refetch
    goal: Ask for the full text now
    surface: sidecar
    route: /entries/{entry_id}
    success: The button shows progress within a second and the text is replaced in place when the fetch ends, or an error says why
    failure_modes:
      - Fetch takes minutes or is queued → say it's queued and keep the current text readable
      - Fetch fails (paywall, block, timeout) → a reason and the next step (log in, proxy), never a silent return to idle
      - Button stuck on "Fetching…" with no change → bounded by a timeout that reports
  - id: escape-to-original
    goal: Open the publisher's page when the in-app text isn't good enough
    surface: sidecar
    route: /entries/{entry_id}
    success: One tap opens the original URL in a new tab
    failure_modes:
      - The original link is buried below the article → reachable from the article header
signals:
  - name: leaves-for-original
    kind: sql
    query: "SELECT count(*) FROM engagement_events WHERE signal = 'open_original' AND created_at > now() - interval '{window_days} days'"
    window_days: 30
    threshold: 3
    becomes_evidence: The owner went to the publisher's page several times this month; that can mean the in-app text failed, or just a wish to comment or share, so it is a lead to check, not proof.
  - name: extraction-given-up
    kind: sql
    query: "SELECT count(*) FROM extract_attempts WHERE given_up AND updated_at > now() - interval '{window_days} days'"
    window_days: 30
    threshold: 1
    becomes_evidence: Articles whose full text the app stopped trying to get; each is a reader who will see only the teaser.
