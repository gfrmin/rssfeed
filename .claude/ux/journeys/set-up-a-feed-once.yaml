persona: owner-maintainer
jtbd: "When a feed needs special handling (full text, my paid login, higher priority, muting an author), I want to set it once from wherever I am, including my phone, so it just works from then on."
provenance: evidence
source: >-
  Owner's Claude prompt history (private, see README): 2026-03-31 ("the setting for whether we want
  full articles or not shouldn't be in the main screen, it's set and forget per feed"; "how do I
  change priority?"; a toggle answering with raw JSON instead of OFF), 2026-04-02 ("how to go to feed
  settings page from [a feed page] or entry from the feed"), 2026-04-06 (filter/search feed names on
  the feeds page), 2026-04-08 (hide tags by default), 2026-06-25/26 ("clearer and better feed
  settings, especially for collecting [a magazine's] articles using my credentials (i pay for a
  subscription)"; "let's say i'm not next to the computer (like now), how can i log in?"; "when i
  clicked 'log in' nothing happened"; rate-limit article fetching), 2026-09-01 ("how to get to a feed's config
  page"). Prod DB 2026-10-18: 3 mute_tag and 3 unmute_tag events, 2026-07-28 to 2026-09-29.
steps:
  - id: find-the-feed
    goal: Reach one feed's settings among 500+
    surface: sidecar
    route: /feeds/{feed_id}
    success: Settings open in one step from the feed's sidebar row, its feed page header, an article from it, or the ⌘K palette by name
    failure_modes:
      - Only reachable from an article gear or the management table → a settings entry on the feed page and sidebar row
      - Searching by part of the name finds nothing because of punctuation/case → forgiving match
  - id: change-a-setting
    goal: Turn on full text, set priority, mute an author or tag
    surface: sidecar
    route: /feeds/{feed_id}
    success: Each control shows its current state in words, changes in place, and says what it will do to future posts
    first_screen: The feed's name and its current full-text, priority and paused states
    failure_modes:
      - A toggle answers with JSON or a page reload → the control re-renders with its new state
      - Full text costs money or load (proxy, rate limits) → the cost is said next to the control
      - A mute hides posts I then can't find → muted counts shown, with an undo
  - id: log-in-to-a-paid-site
    goal: Let the reader fetch articles I pay for, from my phone
    surface: sidecar
    route: /feeds/{feed_id}
    success: A login works by username/password from the phone, says how many cookies it got, and the next fetch shows full text
    failure_modes:
      - The login button does nothing visible → progress, then success or the site's reason
      - The only route is importing cookies from desktop Firefox → a phone-usable path is offered first when away from the desktop
      - Login succeeds but full text is still truncated → the article says the login was used and still came back short
    scent: '"Subscription login", named for what the owner has, not "cookies"'
signals:
  - name: setting-changes
    kind: none
    note: Nothing records settings changes. Log feed-config writes (feed id, setting, time) to the DB to measure how often this journey happens.
    becomes_evidence: How often the owner configures a feed, and from which device.
