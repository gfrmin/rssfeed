[project]
name = "rssfeed-sidecar"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "trafilatura>=2.0",
    "readability-lxml>=0.8",
    # HTML sanitiser (Rust/ammonia binding). Trust boundary for any feed- or
    # web-supplied HTML we render: strict inline allowlist for titles, a richer
    # allowlist for article bodies. readability/lxml allowlist tags but not
    # attributes, so event handlers / javascript: URLs need scrubbing here.
    "nh3>=0.2.17",
    "python-multipart>=0.0.18",
    "humanize>=4.0",
    # Drives a self-hosted headless Chromium for server-side paywall login
    # (BrightData's Scraping Browser forbids password typing). REQUIRES a one-time
    # `playwright install chromium` on the host to provision the browser binary.
    #
    # Kept as a base dependency even though logins are optional: it installs
    # cleanly from PyPI for anyone. The extra below exists to unblock INSTALLATION,
    # not to minimise footprint, and a large wheel is not a blocker.
    "playwright>=1.40",
]

[project.optional-dependencies]
# The learning ranker. Optional because the feature is: ranker_client fails open
# (score() returns None and the caller keeps priority+recency ordering), and the
# import is lazy, inside _ensure_started(), whose except-clause already treats a
# missing module like any other unavailable engine.
#
#     uv sync --extra ranker
#
# It is an EXTRA rather than a base dependency because it was the one thing that
# made this repo un-installable by anyone but its author: it is sourced from the
# credence repo, was pinned to the relative path ../../credence/..., and so
# `uv sync` failed outright unless you happened to keep a credence checkout as a
# sibling directory. A reader nobody else can install is not a reader anybody else
# can use.
ranker = ["credence-skin-client"]

# The thin JSON-RPC wire client for the Credence skin engine (Part C). Pure stdlib,
# zero transitive deps; the wire is the ONLY surface (no juliacall). Not on PyPI, so
# it comes straight from the (public) credence repo -- NOT from a relative path to a
# sibling checkout, which only ever resolved on the author's machine. uv pins the
# resolved commit in uv.lock, so this is reproducible.
#
# Only the thin Python wire client comes from here. The ENGINE is still whatever
# CREDENCE_SKIN_SERVER / CREDENCE_SKIN_COMMAND point at -- a local Julia checkout
# during development, or the pinned container image in production -- so developing
# against a local credence is unaffected.
[tool.uv.sources]
credence-skin-client = { git = "https://github.com/gfrmin/credence", subdirectory = "apps/skin/clients/python" }

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "corpus: real-page extraction regression corpus (skips when the gitignored blobs are absent; run with -m corpus)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Deliberately conservative: correctness and dead-code rules that catch real bugs,
# not stylistic opinions. The codebase is hand-styled and consistent; a maximal
# ruleset would mean a huge reformat diff for no defect-finding benefit.
select = [
    "F",    # pyflakes — undefined names, unused imports/variables
    "E4",   # import formatting
    "E7",   # statement-level mistakes (comparisons to None/True, etc.)
    "E9",   # syntax/IO errors
    "B",    # flake8-bugbear — likely bugs (mutable defaults, unused loop vars)
    "UP",   # pyupgrade — modern syntax for the pinned Python floor
    "I",    # isort — import ordering
]
# B008 fires on FastAPI's Depends()/Query() defaults, which is the framework's
# intended idiom, not a bug.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Tests group their imports under the section they belong to, and use semicolons
# for compact setup lines. Both are readable choices in a test file and neither is
# a defect, so don't churn them to satisfy a layout rule.
"tests/*" = ["E402", "E702"]
