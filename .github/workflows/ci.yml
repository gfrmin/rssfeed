# Lint + tests for the sidecar, plus the shape half of the PII guard.
#
# The guard has two halves. The DENYLIST half needs $LIFE_AGENT_KB, a private file
# that never leaves the operator's machine, and fail-closes without it -- that half
# can only run in the local pre-commit/pre-push hooks. The SHAPE half needs nothing
# and runs here: it is what catches an email address, a checksum-valid ID number or
# a tailnet address, including in a fork's PR, and including on a push that used
# --no-verify. Local hooks are not a gate a public repo can rely on alone.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # A plain single checkout. This used to check out gfrmin/credence
      # side-by-side, because sidecar/pyproject.toml sourced credence-skin-client
      # from the relative path ../../credence/... -- so CI passed while a fresh
      # clone could not `uv sync` at all. The ranker is an optional extra now and
      # its source is the credence repo directly, so the layout assumption is gone
      # from both places at once.
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"   # matches sidecar/Dockerfile (python:3.12-slim)
          enable-cache: true
          cache-dependency-glob: "sidecar/uv.lock"

      # Base install ONLY -- no extras. This is deliberately the same thing a
      # stranger gets from `git clone && uv sync`, so CI fails if the project ever
      # stops being installable on its own again.
      - name: Lint
        working-directory: sidecar
        run: uv run ruff check .
      - name: Test
        working-directory: sidecar
        run: uv run pytest

      # The ranker extra resolves from a git source, which nothing above exercises.
      # Without this, breaking that source (a moved subdirectory, a renamed repo)
      # would stay green here and only fail for whoever tried to enable the ranker.
      - name: Ranker extra resolves
        working-directory: sidecar
        run: |
          uv sync --extra ranker
          uv run --extra ranker python -c "import credence_skin_client"

      # Structural half of the PII guard -- no denylist, so no private file needed.
      # It scans every tracked file, not the diff: a leak that lands by any route
      # (a merge, a rebase, a bypassed hook) still fails the branch it sits on.
      - name: PII guard (shapes)
        run: python3 .githooks/pii_check.py --shapes-only
