<!DOCTYPE html>
<html lang="en" data-theme="dark" data-mono-meta="1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Reader{% endblock %} — Reader</title>
  <link rel="stylesheet" href="/static/tailwind.css">
  <link rel="stylesheet" href="/static/style.css?v=ds7">
  <link rel="icon" href="/static/icon-192.png">
  <link rel="manifest" href="/static/manifest.json">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  {% block body %}
  {# Fallback chrome for standalone pages not yet folded into the three-pane shell. #}
  <div class="legacy-page">
    <nav class="legacy-topbar">
      <a href="/entries?status=unread" class="brand-name" style="font-weight:700;letter-spacing:.14em;">&#9626; READER</a>
      <a href="/entries?status=unread">Unread</a>
      <a href="/entries?status=all">All</a>
      <a href="/entries?starred=true">Starred</a>
      <a href="/">Feeds</a>
      <span style="flex:1"></span>
      <a href="/cookies">Cookies</a>
    </nav>
    <main class="legacy-main">{% block content %}{% endblock %}</main>
  </div>
  {% endblock %}

  {# Shared overlay slot (feed-settings / diff fragments load here). #}
  <div id="overlay-slot">{% block overlays %}{% endblock %}</div>
  <div id="toasts" class="toasts"></div>

  <script src="/static/app.js?v=ds9"></script>
  <script src="/static/mobile.js?v=ds4"></script>
</body>
</html>
