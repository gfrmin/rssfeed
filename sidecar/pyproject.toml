[project]
name = "rssfeed-sidecar"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "trafilatura>=2.0",
    "readability-lxml>=0.8",
    # HTML sanitiser (Rust/ammonia binding). Trust boundary for any feed- or
    # web-supplied HTML we render: strict inline allowlist for titles, a richer
    # allowlist for article bodies. readability/lxml allowlist tags but not
    # attributes, so event handlers / javascript: URLs need scrubbing here.
    "nh3>=0.2.17",
    "python-multipart>=0.0.18",
    "humanize>=4.0",
    "credence-skin-client",
    # Drives a self-hosted headless Chromium for server-side paywall login
    # (BrightData's Scraping Browser forbids password typing). REQUIRES a one-time
    # `playwright install chromium` on the host to provision the browser binary.
    "playwright>=1.40",
]

# The thin JSON-RPC wire client for the Credence skin engine (Part C). Pure stdlib,
# zero transitive deps; the wire is the ONLY surface (no juliacall). Sourced from
# the sibling credence checkout; set CREDENCE_SKIN_COMMAND to use the pinned image
# instead at runtime. Not yet on PyPI.
[tool.uv.sources]
credence-skin-client = { path = "../../credence/apps/skin/clients/python" }

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Deliberately conservative: correctness and dead-code rules that catch real bugs,
# not stylistic opinions. The codebase is hand-styled and consistent; a maximal
# ruleset would mean a huge reformat diff for no defect-finding benefit.
select = [
    "F",    # pyflakes — undefined names, unused imports/variables
    "E4",   # import formatting
    "E7",   # statement-level mistakes (comparisons to None/True, etc.)
    "E9",   # syntax/IO errors
    "B",    # flake8-bugbear — likely bugs (mutable defaults, unused loop vars)
    "UP",   # pyupgrade — modern syntax for the pinned Python floor
    "I",    # isort — import ordering
]
# B008 fires on FastAPI's Depends()/Query() defaults, which is the framework's
# intended idiom, not a bug.
ignore = ["B008"]
